# Mirror configuration
# Each entry defines a source image, its destination on quay.io, and the tags to mirror.

images:
  - source: lscr.io/linuxserver/zotero
    destination: quay.io/tjarbo/zotero
    tags:
      - latest
  - source: lscr.io/linuxserver/code-server
    destination: quay.io/tjarbo/code-server
    tags:
      - latest
  - source: lscr.io/linuxserver/chrome
    destination: quay.io/tjarbo/chrome
    tags:
      - latest
